spring.application.name=tiendagas
server.port=8080

# Las claves (JWT y contraseña de MySQL si tienes) van en secretos.properties,
# que NO se sube a GitHub (está en .gitignore). Copia secretos.example.properties.
spring.config.import=optional:classpath:secretos.properties

# Conexión a MySQL (XAMPP). La base se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/bd_tienda_gas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: la clave secreta se define en secretos.properties (mínimo 32 caracteres)
app.jwt.secret=
app.jwt.expiration-minutes=30
app.jwt.refresh-expiration-days=7
app.jwt.issuer=tienda-gas-volcan

# Frontend que puede llamar a la API (CORS)
app.cors.origenes=http://localhost:5173,http://localhost:4173

# Dirección de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
