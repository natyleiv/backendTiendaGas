# Configuración SOLO para las pruebas: base H2 en memoria (no toca MySQL).
spring.datasource.url=jdbc:h2:mem:tiendagas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=ClaveSoloParaPruebasDeIntegracion2026_123456
app.jwt.expiration-minutes=30
app.jwt.refresh-expiration-days=7
app.jwt.issuer=tienda-gas-volcan
app.cors.origenes=http://localhost:5173
spring.jpa.open-in-view=false
